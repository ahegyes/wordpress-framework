name: Bug report
description: Report a defect in one of the framework packages.
labels: [bug, triage]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - wp-framework-bootstrap
        - wp-framework-core
        - wp-framework-utilities
        - wp-framework-woocommerce
        - other / unsure
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: '2.0.0 or trunk@<sha>'
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: '8.5.0'
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: '7.0'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install package X
        2. Call method Y
        3. Observe Z
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack traces
      render: text
