version: 2
updates:
  - package-ecosystem: composer
    directories:
      - /
      - /tests/Fixtures/consumer-a
      - /tests/Fixtures/consumer-b
      - /tests/Fixtures/personas/*
    # configs moves only together with its 14 workflow refs and npm pin, which Dependabot cannot move.
    ignore:
      - dependency-name: ahegyes/wordpress-configs
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      php-dev-deps:
        patterns:
          - '*'
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-dev-deps:
        patterns:
          - '*'
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
