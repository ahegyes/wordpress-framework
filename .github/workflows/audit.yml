name: Supply-Chain Audit

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    # Dev-dependency advisories surface through Dependabot alerts instead of failing this gate.
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-supply-chain-audit.yml@1ebc3fa3d9a65127f6d39e807f8aed2f7a3b00d9
    with:
      npm-audit-flags: '--omit=dev --audit-level=high'
