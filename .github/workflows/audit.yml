name: Supply-Chain Audit

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    # Dev-dependency advisories surface through Dependabot alerts instead of failing this gate.
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-supply-chain-audit.yml@e2465409c4e9f0c219f87ea5624eb0e17d18dc3b
    with:
      npm-audit-flags: '--omit=dev --audit-level=high'
