name: Supply-Chain Audit

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    # Dev-dependency advisories surface through Dependabot alerts instead of failing this gate.
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-supply-chain-audit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      npm-audit-flags: '--omit=dev --audit-level=high'
