name: Mutation Tests

on:
  workflow_dispatch:
  schedule:
    # Weekly on Mondays at 06:00 UTC. Catches test-suite quality regression
    # without gating every PR (mutation runs are slow).
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  infection:
    name: Run Infection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run Infection
        run: composer test:unit:mutation

      - name: Upload Infection logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-logs
          path: build/infection/

  infection-integration:
    name: Run Infection (Integration)
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@4214abd176545fe11f90ce6a449f8fc3fd7a9315
    with:
      php-version: '8.5'
      composer-script: 'test:integration:mutation'
      wp-env-config-file: '.wp-env.tests.json'
      # In-container coverage driver for Infection (the composer script's preflight accepts xdebug coverage mode).
      wp-env-xdebug: 'coverage'
