name: Mutation Tests

on:
  workflow_dispatch:
  schedule:
    # Weekly on Mondays at 06:00 UTC. Catches test-suite quality regression
    # without gating every PR (mutation runs are slow).
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  infection:
    name: Run Infection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6

      - name: Run Infection
        run: composer test:mutation

      - name: Upload Infection logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: infection-logs
          path: build/infection/
