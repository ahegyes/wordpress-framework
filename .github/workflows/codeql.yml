name: CodeQL

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-codeql.yml@e2465409c4e9f0c219f87ea5624eb0e17d18dc3b
