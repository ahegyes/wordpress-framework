name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  schedule:
    # Weekly Monday 06:00 UTC. Keeps zizmor's online audits (e.g.
    # known-vulnerable-actions) fresh between workflow changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Workflow Checks
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-workflow-checks.yml@4214abd176545fe11f90ce6a449f8fc3fd7a9315
