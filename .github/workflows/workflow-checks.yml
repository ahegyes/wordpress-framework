name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  schedule:
    # Re-runs zizmor's online audits between workflow changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Workflow Checks
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-workflow-checks.yml@b107001cce9f2960495d9d50481c8540d228f60c
