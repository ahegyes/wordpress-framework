name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  schedule:
    # Re-runs zizmor's online audits between workflow changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Workflow Checks
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-workflow-checks.yml@e2465409c4e9f0c219f87ea5624eb0e17d18dc3b
