name: Consumer Smoke

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Consumer install + scope + autoload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install consumer-smoke fixture
        uses: ramsey/composer-install@v4
        with:
          working-directory: tests/Fixtures/consumer-smoke
          composer-options: '--prefer-dist'

      - name: Run smoke
        working-directory: tests/Fixtures/consumer-smoke
        run: composer smoke

      - name: Assert scoped output sanity
        working-directory: tests/Fixtures/consumer-smoke
        run: |
          set -e

          diff vendor/php-di/php-di/src/Compiler/Template.php dependencies/php-di/php-di/src/Compiler/Template.php

          if grep -qF 'DWS_CONSUMER_SMOKE_Deps\WP_Error' dependencies/ahegyes/wp-framework-bootstrap/check-requirements.php; then
            echo "FAIL: WP_Error got prefixed inside scoped check-requirements.php" >&2
            exit 1
          fi

          if ! grep -qF 'namespace DWS_CONSUMER_SMOKE_Deps\DeepWebSolutions\Framework\Core\Kernel' dependencies/ahegyes/wp-framework-core/src/Kernel/PluginKernel.php; then
            echo "FAIL: PluginKernel.php missing scoped namespace declaration" >&2
            exit 1
          fi

          if grep -qF 'DWS_CONSUMER_SMOKE_Deps\Psr\Container' dependencies/ahegyes/wp-framework-core/src/Kernel/PluginKernel.php; then
            echo "FAIL: Psr\\Container namespace got prefixed" >&2
            exit 1
          fi
