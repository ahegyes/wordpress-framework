name: Split Packages

on:
  push:
    branches: [trunk]
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    name: Split ${{ matrix.package.dir }} → ${{ matrix.package.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { dir: 'bootstrap',   repo: 'wp-framework-bootstrap' }
          - { dir: 'core',        repo: 'wp-framework-core' }
          - { dir: 'settings',    repo: 'wp-framework-settings' }
          - { dir: 'shared',      repo: 'wp-framework-shared' }
          - { dir: 'storage',     repo: 'wp-framework-storage' }
          - { dir: 'utilities',   repo: 'wp-framework-utilities' }
          - { dir: 'woocommerce', repo: 'wp-framework-woocommerce' }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Don't install the credential helper that auths as github-actions[bot].
          # We push to the split repos via PAT embedded in the URL — the helper
          # would otherwise hijack the auth and fail with 403.
          persist-credentials: false

      - name: Install splitsh-lite
        run: |
          # v1.0.1 (2017) is the latest splitsh-lite release with a published
          # linux/amd64 binary; v2.0.0 was tagged in 2023 with no assets attached.
          # The tool's `--prefix` behavior hasn't materially changed since v1.
          curl -fsSL -o splitsh.tar.gz https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz
          # sha256 computed from the v1.0.1 release asset (upstream publishes no checksums — trust-on-first-use pin).
          echo "2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc  splitsh.tar.gz" | sha256sum -c -
          tar -xzf splitsh.tar.gz
          sudo mv splitsh-lite /usr/local/bin/
          rm splitsh.tar.gz

      - name: Compute split SHA for packages/${{ matrix.package.dir }}
        id: split
        env:
          PKG_DIR: ${{ matrix.package.dir }}
        run: |
          SHA=$(splitsh-lite --prefix="packages/$PKG_DIR")
          # An empty SHA would turn the force-push refspec into remote branch deletion.
          if [ -z "$SHA" ] || ! git cat-file -e "$SHA^{commit}"; then
            echo "::error::splitsh produced no valid commit for packages/$PKG_DIR"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Split SHA: $SHA"

      - name: Push split to ahegyes/${{ matrix.package.repo }}
        env:
          TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
          SPLIT_SHA: ${{ steps.split.outputs.sha }}
          TARGET_REPO: ${{ matrix.package.repo }}
        run: |
          git push --force "https://x-access-token:${TOKEN}@github.com/ahegyes/${TARGET_REPO}.git" "${SPLIT_SHA}:refs/heads/trunk"
