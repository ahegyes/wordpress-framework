name: Quality

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  php-qa:
    name: PHP QA
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-qa.yml@trunk
    with:
      php-version: '8.5'

  deptrac:
    name: Deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint:php:deptrac
