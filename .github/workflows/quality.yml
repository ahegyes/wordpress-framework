name: Quality

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  lint-php:
    name: Lint PHP
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-lint.yml@16169596e0fb3060f267ba13a9e10e32da026db7
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  php-syntax:
    name: PHP syntax
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-syntax-check.yml@16169596e0fb3060f267ba13a9e10e32da026db7
    with:
      php-versions: '["7.4"]'
      paths: '["packages/bootstrap"]'
