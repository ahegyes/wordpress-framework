name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@6302f1f9170ef7187027bf39f0c07b84896e930b
    with:
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  integration:
    name: Integration
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@6302f1f9170ef7187027bf39f0c07b84896e930b
    with:
      php-version: '8.5'
      composer-script: 'test:integration'
      wp-env-config-file: '.wp-env.tests.json'
