name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@c944e73ab2656633397e7736ea104bbe72726ffd
    with:
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  wordpress:
    name: WordPress versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The floor is the highest WordPress a package declares, and WordPress's version API offers the newest release of every branch, so new releases and floors join without an edit here.
      - name: List the newest release of every branch from the floor up
        id: versions
        run: |
          floor=$(jq -rs 'def v: split(".") | map(tonumber) | . + [0, 0] | .[0:3]; [.[].extra["requires-wp"] // empty] | max_by(v) // error("No package declares extra.requires-wp.")' packages/*/composer.json)
          offers=$(curl -fsS --retry 3 --retry-all-errors --max-time 20 https://api.wordpress.org/core/version-check/1.7/)
          versions=$(printf '%s' "$offers" | jq -c --arg floor "$floor" 'def v: split(".") | map(tonumber) | . + [0, 0] | .[0:3]; [.offers[].version | select(v >= ($floor | v))] | unique | if length == 0 then error("No WordPress release at or above \($floor).") else . end')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration
    needs: wordpress
    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.wordpress.outputs.versions) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@c944e73ab2656633397e7736ea104bbe72726ffd
    with:
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      composer-script: 'test:integration:run'
      wp-env-config-file: '.wp-env.tests.json'

  integration-multisite:
    name: Integration (multisite)
    needs: wordpress
    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.wordpress.outputs.versions) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@c944e73ab2656633397e7736ea104bbe72726ffd
    with:
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      composer-script: 'test:integration:multisite:run'
      wp-env-config-file: '.wp-env.multisite.json'

  e2e:
    name: E2E
    needs: wordpress
    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.wordpress.outputs.versions) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-playwright-e2e.yml@c944e73ab2656633397e7736ea104bbe72726ffd
    with:
      artifact-slug: wp-${{ matrix.wp }}
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      build-script: ''
      wp-env-config-file: '.wp-env.tests.json'

  integration-php74:
    name: Integration (PHP 7.4)
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@c944e73ab2656633397e7736ea104bbe72726ffd
    with:
      php-version: '8.5'
      composer-script: 'test:integration:php74:run'
      wp-env-config-file: '.wp-env.php74.json'

  prefer-lowest:
    name: Prefer lowest
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@c944e73ab2656633397e7736ea104bbe72726ffd
    with:
      php-version: '8.5'
      composer-script: 'test:integration:lowest:run'
      wp-env-config-file: '.wp-env.tests.json'
