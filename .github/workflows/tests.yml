name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  wordpress:
    name: WordPress versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      # WordPress's version API offers the newest release of every branch, so new majors and point releases join without a commit.
      - name: List the newest release of every branch from the floor up
        id: versions
        env:
          FLOOR: '7.1'
        run: |
          offers=$(curl -fsS https://api.wordpress.org/core/version-check/1.7/)
          versions=$(printf '%s' "$offers" | jq -c --arg floor "$FLOOR" '[.offers[].version | select((split(".")[0:2] | map(tonumber)) >= ($floor | split(".") | map(tonumber)))] | unique | if length == 0 then error("No WordPress release at or above \($floor).") else . end')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration
    needs: wordpress
    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.wordpress.outputs.versions) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      composer-script: 'test:integration:run'
      wp-env-config-file: '.wp-env.tests.json'

  integration-multisite:
    name: Integration (multisite)
    needs: wordpress
    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.wordpress.outputs.versions) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      composer-script: 'test:integration:multisite:run'
      wp-env-config-file: '.wp-env.multisite.json'

  integration-php74:
    name: Integration (PHP 7.4)
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      php-version: '8.5'
      composer-script: 'test:integration:php74:run'
      wp-env-config-file: '.wp-env.php74.json'

  prefer-lowest:
    name: Prefer lowest
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      php-version: '8.5'
      composer-script: 'test:integration:lowest:run'
      wp-env-config-file: '.wp-env.tests.json'
