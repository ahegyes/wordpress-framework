name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@4214abd176545fe11f90ce6a449f8fc3fd7a9315
    with:
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  integration:
    name: Integration (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned for a deterministic gate.
          - label: 'WP 7.0 (floor)'
            php-version: '8.5'
            wp-env-core: 'WordPress/WordPress#tags/7.0'
          # Graceful-failure path: WP 6.9.4 is below the framework's 7.0 floor,
          # so check_requirements must block init with plugin_wp_incompatible.
          - label: 'WP 6.9.4 (below floor)'
            php-version: '8.5'
            wp-env-core: 'WordPress/WordPress#tags/6.9.4'
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@4214abd176545fe11f90ce6a449f8fc3fd7a9315
    with:
      php-version: ${{ matrix.php-version }}
      wp-env-core: ${{ matrix.wp-env-core }}
      composer-script: 'test:integration'
      wp-env-config-file: '.wp-env.tests.json'

  smoke:
    name: Consumer Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install consumer-smoke fixture
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: tests/Fixtures/consumer-smoke
          composer-options: '--prefer-dist'

      - name: Install consumer-smoke-b fixture
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: tests/Fixtures/consumer-smoke-b
          composer-options: '--prefer-dist'

      - name: Run smoke
        working-directory: tests/Fixtures/consumer-smoke
        run: composer smoke

      # Two scoped consumers in one process — the multi-plugin coexistence promise.
      - name: Run coexistence smoke
        run: php tests/Fixtures/smoke-coexistence.php

      - name: Assert scoped output sanity
        working-directory: tests/Fixtures/consumer-smoke
        run: |
          set -e

          # The namespaced prefix appears with single backslashes in code and doubled ones inside string literals.
          prefix_re='DeepWebSolutions\\{1,2}SmokeFixture\\{1,2}Scoped\\{1,2}'

          diff vendor/php-di/php-di/src/Compiler/Template.php dependencies/php-di/php-di/src/Compiler/Template.php

          if grep -rqE "${prefix_re}WP_Error" dependencies/ahegyes/wp-framework-bootstrap/; then
            echo "FAIL: WP_Error got prefixed inside scoped bootstrap" >&2
            exit 1
          fi

          if ! grep -qF 'namespace DeepWebSolutions\SmokeFixture\Scoped\DeepWebSolutions\Framework\Core' dependencies/ahegyes/wp-framework-core/src/PluginKernel.php; then
            echo "FAIL: PluginKernel.php missing scoped namespace declaration" >&2
            exit 1
          fi

          if grep -qE "${prefix_re}Psr\\\\{1,2}Container" dependencies/ahegyes/wp-framework-core/src/PluginKernel.php; then
            echo "FAIL: Psr\\Container namespace got prefixed" >&2
            exit 1
          fi

          # Framework text domains are rewritten to the consumer's domain at scope time, so framework strings ship translatable under the consumer's catalog.
          if grep -rqF "'wp-framework-" dependencies/; then
            echo "FAIL: a 'wp-framework-*' text domain survived scoping; the textdomain patcher did not run" >&2
            grep -rnF "'wp-framework-" dependencies/ >&2
            exit 1
          fi

          if ! grep -rqF "'consumer-smoke'" dependencies/ahegyes/wp-framework-bootstrap/; then
            echo "FAIL: framework strings were not rewritten to the consumer text domain" >&2
            exit 1
          fi

          # WooCommerce runtime symbols are host-provided; scoping must leave them unprefixed.
          if grep -rqE "${prefix_re}(WC_|wc_|WooCommerce)" dependencies/ahegyes/wp-framework-woocommerce/; then
            echo "FAIL: a WooCommerce symbol got prefixed inside scoped woocommerce" >&2
            grep -rnE "${prefix_re}(WC_|wc_|WooCommerce)" dependencies/ahegyes/wp-framework-woocommerce/ >&2
            exit 1
          fi

          if ! grep -rqF '\wc_get_order(' dependencies/ahegyes/wp-framework-woocommerce/; then
            echo "FAIL: expected an unprefixed WooCommerce call in scoped woocommerce" >&2
            exit 1
          fi

          if grep -rqE "${prefix_re}as_[a-z_]+" dependencies/ahegyes/wp-framework-infrastructure/; then
            echo "FAIL: an Action Scheduler as_* call got prefixed inside scoped infrastructure" >&2
            grep -rnE "${prefix_re}as_[a-z_]+" dependencies/ahegyes/wp-framework-infrastructure/ >&2
            exit 1
          fi
