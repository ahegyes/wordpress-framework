name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@16169596e0fb3060f267ba13a9e10e32da026db7
    with:
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  integration:
    name: Integration
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@16169596e0fb3060f267ba13a9e10e32da026db7
    with:
      php-version: '8.5'
      composer-script: 'test:integration:run'
      wp-env-config-file: '.wp-env.tests.json'

  integration-multisite:
    name: Integration (multisite)
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@16169596e0fb3060f267ba13a9e10e32da026db7
    with:
      php-version: '8.5'
      composer-script: 'test:integration:multisite:run'
      wp-env-config-file: '.wp-env.multisite.json'
