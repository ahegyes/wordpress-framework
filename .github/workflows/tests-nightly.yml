name: Tests (nightly)

# WordPress trunk and WooCommerce's trunk build change daily without a commit here, so this runs on a schedule instead of blocking pull requests.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      php-version: '8.5'
      wp-env-core: 'https://wordpress.org/nightly-builds/wordpress-latest.zip'
      composer-script: 'test:integration:run'
      wp-env-config-file: '.wp-env.tests.json'

  integration-multisite:
    name: Integration (multisite)
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      php-version: '8.5'
      wp-env-core: 'https://wordpress.org/nightly-builds/wordpress-latest.zip'
      composer-script: 'test:integration:multisite:run'
      wp-env-config-file: '.wp-env.multisite.json'

  integration-woocommerce-nightly:
    name: Integration (WooCommerce nightly)
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      php-version: '8.5'
      composer-script: 'test:integration:woocommerce-nightly:run'
      wp-env-config-file: '.wp-env.woocommerce-nightly.json'
