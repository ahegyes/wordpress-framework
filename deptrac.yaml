deptrac:
  paths:
    - ./packages/bootstrap
    - ./packages/core/src
    - ./packages/infrastructure/src
    - ./packages/shared/src
    - ./packages/woocommerce/src

  exclude_files:
    - '#packages/.*/tests/.*#'
    - '#packages/.*/changelog/.*#'
    - '#packages/.*/vendor/.*#'

  layers:
    - name: Bootstrap
      collectors:
        - type: directory
          value: 'packages/bootstrap/.*'

    - name: Shared
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Shared\\.*$'

    - name: Storage
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Storage\\.*$'

    - name: Core
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Core\\.*$'

    - name: Utilities
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Utilities\\.*$'

    # The Settings namespace is three disjoint concept sublayers (deptrac warns on tokens in more than
    # one layer, so there is no umbrella Settings layer); the Settings boundary is their union.
    - name: Settings_Schema
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Settings\\Schema\\.*$'

    - name: Settings_Backend
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Settings\\Backend\\.*$'

    - name: Settings_MetaField
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Settings\\MetaField\\.*$'

    - name: WooCommerce
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\WooCommerce\\.*$'

  # Allowed direct dependencies per layer; allowances are not transitive, so no layer reaches Bootstrap through Core.
  # Bootstrap (PHP 5.6+, pre-autoload) cannot depend on the PHP 8.5+ Shared kernel.
  ruleset:
    Bootstrap: ~
    Shared: ~
    Storage: ~
    Core:
      - Bootstrap
      - Shared
    Utilities:
      - Core
      - Shared
      - Storage
    Settings_Schema:
      - Shared
    Settings_Backend:
      - Settings_Schema
      - Storage
      - Shared
    Settings_MetaField:
      - Settings_Schema
      - Storage
      - Shared
    WooCommerce:
      - Core
      - Shared
      - Storage
      - Settings_Schema
      - Settings_Backend
      - Settings_MetaField
