deptrac:
  paths:
    - ./packages/bootstrap
    - ./packages/core/src
    - ./packages/settings/src
    - ./packages/shared/src
    - ./packages/storage/src
    - ./packages/utilities/src
    - ./packages/woocommerce/src

  exclude_files:
    - '#packages/.*/tests/.*#'
    - '#packages/.*/changelog/.*#'
    - '#packages/.*/vendor/.*#'

  layers:
    - name: Bootstrap
      collectors:
        - type: directory
          value: 'packages/bootstrap/.*'

    - name: Shared
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Shared\\.*$'

    - name: Storage
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Storage\\.*$'

    - name: Core
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Core\\.*$'

    - name: Utilities
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Utilities\\.*$'

    - name: Settings
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Settings\\.*$'

    - name: WooCommerce
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\WooCommerce\\.*$'

  # Allowed direct dependencies per layer.
  # Shared is the WP-agnostic shared kernel — has zero deps and may be required directly by any layer above Bootstrap (Common Closure Principle).
  # Storage is a second zero-dep leaf (KV storage backends; WP-runtime-coupled but no internal framework deps) — required directly by Utilities and Settings.
  # Settings is the declarative-settings stack (descriptors + WP/object-field backends) — depends only on Storage + Shared, NOT Core or Utilities.
  # Bootstrap stays minimal (PHP 5.6+, pre-autoload) — cannot depend on Shared (PHP 8.5+).
  # Cross-layer shortcuts are forbidden (Utilities → Bootstrap directly is NOT allowed; must go through Core).
  ruleset:
    Bootstrap: ~
    Shared: ~
    Storage: ~
    Core:
      - Bootstrap
      - Shared
    Utilities:
      - Core
      - Shared
      - Storage
    Settings:
      - Storage
      - Shared
    WooCommerce:
      - Core
      - Shared
      - Settings
