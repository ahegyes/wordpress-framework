deptrac:
  paths:
    - ./packages/bootstrap
    - ./packages/core/src
    - ./packages/settings/src
    - ./packages/shared/src
    - ./packages/storage/src
    - ./packages/utilities/src
    - ./packages/woocommerce/src

  exclude_files:
    - '#packages/.*/tests/.*#'
    - '#packages/.*/changelog/.*#'
    - '#packages/.*/vendor/.*#'

  layers:
    - name: Bootstrap
      collectors:
        - type: directory
          value: 'packages/bootstrap/.*'

    - name: Shared
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Shared\\.*$'

    - name: Storage
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Storage\\.*$'

    - name: Core
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Core\\.*$'

    - name: Utilities
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Utilities\\.*$'

    # The settings package is three disjoint concept sublayers (deptrac warns on tokens in more than
    # one layer, so there is no umbrella Settings layer); the package boundary is their union.
    - name: Settings_Schema
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Settings\\Schema\\.*$'

    - name: Settings_Backend
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Settings\\Backend\\.*$'

    - name: Settings_MetaField
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\Settings\\MetaField\\.*$'

    - name: WooCommerce
      collectors:
        - type: classLike
          value: '^DeepWebSolutions\\Framework\\WooCommerce\\.*$'

  # Allowed direct dependencies per layer.
  # Shared is the runtime-WP-aware shared kernel; zero internal framework deps; no WP-specific abstractions; may be required directly by any layer above Bootstrap (Common Closure Principle).
  # Storage is a second zero-dep leaf (KV storage backends + object-meta repositories; WP-runtime-coupled but no internal framework deps) — required directly by Utilities, Settings, and WooCommerce.
  # The Settings_* sublayers union to the settings package: Schema is the package-internal sink; Backend and MetaField sit on it and never on each other; the package as a whole depends only on Storage + Shared.
  # Bootstrap stays minimal (PHP 5.6+, pre-autoload) — cannot depend on Shared (PHP 8.5+).
  # Only Core may depend on Bootstrap; no other layer has Bootstrap access, direct or indirect (allowances are not transitive).
  ruleset:
    Bootstrap: ~
    Shared: ~
    Storage: ~
    Core:
      - Bootstrap
      - Shared
    Utilities:
      - Core
      - Shared
      - Storage
    Settings_Schema:
      - Shared
    Settings_Backend:
      - Settings_Schema
      - Storage
      - Shared
    Settings_MetaField:
      - Settings_Schema
      - Storage
      - Shared
    WooCommerce:
      - Core
      - Shared
      - Storage
      - Settings_Schema
      - Settings_Backend
      - Settings_MetaField
